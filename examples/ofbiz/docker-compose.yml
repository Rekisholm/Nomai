services:
 web:
   build: .
   ports:
    - "8080:8080"
   environment:
      USE_POSTGRES: "true"
   volumes:
    - ./data:/usr/src/apache-ofbiz/runtime/uploads
    - ./logs:/tmp/logs
    - ./hook/table_config.json:/tmp/table_config.json
    - ../../rust_sqlparse_java/libjni_sql_rewriter.so:/libjni_sql_rewriter.so
    
 postgres:
  image: pg-request-logger:13.12
  volumes:
    - ./postgres-data:/var/lib/postgresql/data
  ports:
    - "5432:5432"
  environment:
    - POSTGRES_PASSWORD=ofbiz
    - POSTGRES_USER=ofbiz
    - POSTGRES_DB=ofbiz
  command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "shared_preload_libraries=request_id_logger,wal2json"
      - "-c"
      - "wal_keep_size=256MB"
      - "-c"
      - "max_connections=100"
