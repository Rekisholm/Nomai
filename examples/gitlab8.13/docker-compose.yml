services:
  redis:
    image: pyh23/redis:cve-2016-9086-inited

  postgresql:
    image: pg-request-logger:13.12
    environment:
    - POSTGRES_USER=gitlab
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=gitlabhq_production
    - DB_EXTENSION=pg_trgm
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "shared_preload_libraries=request_id_logger,wal2json"
      - "-c"
      - "wal_keep_size=256MB"
      - "-c"
      - "max_connections=100"
    volumes:
    - ./load-extensions.sh:/docker-entrypoint-initdb.d/load-extensions.sh
  
  gitlab:
    image: pyh23/gitlab:cve-2016-9086-inited
    depends_on:
    - redis
    - postgresql
    ports:
    - "8080:80"
    environment:
    - DEBUG=false
    - GITLAB_PORT=8080
    - GITLAB_SSH_PORT=10022
    - GITLAB_SECRETS_DB_KEY_BASE=secret-key-is-here1
    - GITLAB_SECRETS_SECRET_KEY_BASE=secret-key-is-here2
    - GITLAB_SECRETS_OTP_KEY_BASE=secret-key-is-here3
    - DB_ADAPTER=postgresql
    - DB_HOST=postgresql
    - DB_USER=gitlab
    - DB_PASS=password
    - DB_NAME=gitlabhq_production
    - REDIS_HOST=redis
    - GITLAB_ROOT_PASSWORD=vulhub123456

    volumes:
      - ./hook/hook.rb:/home/git/gitlab/config/initializers/hook.rb
      - ./hook/hook_pg.rb:/home/git/gitlab/config/initializers/hook_pg.rb
      - ./hook/table_config.json:/tmp/table_config.json
      - ../../rust_sqlparse_compatible/librust_sql_rewriter.so:/tmp/librust_sql_rewriter.so
      - ./logs:/tmp/logs
    
